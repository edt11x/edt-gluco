[package]
name = "gluco"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A Linux desktop window for glucose readings from a LibreLinkUp account"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.18", features = ["software-renderer-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
